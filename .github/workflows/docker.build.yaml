name: Build Docker images
on:
  workflow_dispatch:
  repository_dispatch:
    types: [php-images-built]
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*.*.*'

env:
  IMAGE_DOCKER_HUB: flownative/beach-php
  IMAGE_HARBOR: harbor.flownative.io/docker/beach-php
  PHP_IMAGE: harbor.flownative.io/docker/php

jobs:
  # The images are always built from the latest release.
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.latest_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 100

      - name: Determine latest released version
        id: latest_version
        uses: flownative/action-git-latest-release@v1

  # Every platform is built natively on a runner of its own instead of
  # emulating arm64 with QEMU. The images are pushed by digest only and
  # tagged in the merge job.
  build:
    needs: prepare
    strategy:
      matrix:
        php: [ "8.2", "8.3", "8.4", "8.5" ]
        platform: [ linux/amd64, linux/arm64 ]
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_IO_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_IO_REGISTRY_PASSWORD }}

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.flownative.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}

      # The digest artifact is named after the PHP version found here. Should
      # docker-php publish a new version between the jobs of the two
      # platforms, the merge job finds only one digest per version and fails
      # instead of combining images of different PHP versions.
      - name: Determine latest built PHP ${{ matrix.php }} version
        id: php
        env:
          PHP_BRANCH: ${{ matrix.php }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="$(docker buildx imagetools inspect "${PHP_IMAGE}:${PHP_BRANCH}" \
            --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.version" }}')"
          if ! [[ "${version}" =~ ^${PHP_BRANCH//./\\.}\.[0-9]+$ ]]; then
            echo "::error::${PHP_IMAGE}:${PHP_BRANCH} has an unexpected version label: '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "artifact=digest-${version}-${PLATFORM#linux/}" >> "${GITHUB_OUTPUT}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_DOCKER_HUB }}
            ${{ env.IMAGE_HARBOR }}
          labels: |
            org.opencontainers.image.title=Beach PHP
            org.opencontainers.image.description=Docker image providing PHP for Beach and Local Beach
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Flownative GmbH
            org.opencontainers.image.authors=Robert Lemke <robert@flownative.com>
            org.opencontainers.image.version=${{ steps.php.outputs.version }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          build-args: |
            PHP_BASE_IMAGE=${{ env.PHP_IMAGE }}:${{ steps.php.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.IMAGE_DOCKER_HUB }},${{ env.IMAGE_HARBOR }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.php.outputs.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the images of all platforms into one manifest list per PHP
  # version and tags it in both registries. The PHP versions are taken from
  # the names of the digest artifacts, so they are listed only once above.
  merge:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_IO_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_IO_REGISTRY_PASSWORD }}

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.flownative.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}

      # Each registry gets its manifest list from the images pushed to that
      # same registry, so no blobs have to be copied between registries.
      - name: Create manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail

          # Docker Hub answers bursts of requests with 429 Too Many Requests,
          # so every call to it is retried with a growing delay.
          retry() {
            local attempt=1 delay=30
            until "$@"; do
              if [ "${attempt}" -ge 5 ]; then
                return 1
              fi
              echo "::warning::Attempt ${attempt} failed, retrying in ${delay} seconds"
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          versions="$(find . -mindepth 1 -maxdepth 1 -type d -name 'digest-*' | sed -n 's|^\./digest-\([0-9.]*\)-[a-z0-9]*$|\1|p' | sort -u)"
          [ -n "${versions}" ] || { echo "::error::No digests found"; exit 1; }
          for version in ${versions}; do
            # Each artifact is a directory holding one empty file named
            # after the digest.
            digests="$(find . -mindepth 2 -path "./digest-${version}-*/*" -type f -exec basename {} \;)"
            count="$(echo "${digests}" | wc -w | tr -d ' ')"
            if [ "${count}" -ne 2 ]; then
              echo "::error::PHP ${version}: expected 2 digests, found ${count}"
              exit 1
            fi
            for image in "${IMAGE_DOCKER_HUB}" "${IMAGE_HARBOR}"; do
              sources=()
              for digest in ${digests}; do
                sources+=("${image}@sha256:${digest}")
              done
              echo "::group::${image}:${version}"
              retry docker buildx imagetools create \
                --tag "${image}:${version%.*}" \
                --tag "${image}:${version}" \
                "${sources[@]}"
              # Only Harbor is inspected, to spare Docker Hub the requests.
              case "${image}" in
                harbor.flownative.io/*) retry docker buildx imagetools inspect "${image}:${version}" ;;
              esac
              echo "::endgroup::"
            done
          done

  announce:
    runs-on: ubuntu-26.04
    needs: merge
    steps:
      - name: Dispatch to beach-php-k8s
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FLOWNATIVE_BOT_TOKEN }}
          repository: flownative/docker-beach-php-k8s
          event-type: beach-php-images-built
          client-payload: '{"image_name": "flownative/docker-php/beach-php"}'
      - name: Dispatch to versions.flownative.io
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FLOWNATIVE_BOT_TOKEN }}
          repository: flownative/versions.flownative.io
          event-type: beach-php-images-built
          client-payload: '{"image_name": "flownative/docker-php/beach-php"}'

      - name: Push heartbeat metric to Grafana Cloud
        if: success()
        env:
          RW_URL: ${{ secrets.GRAFANA_METRICS_RW_URL }}
          INSTANCE_ID: ${{ secrets.GRAFANA_METRICS_INSTANCE_ID }}
          TOKEN: ${{ secrets.GRAFANA_METRICS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          # Derive the Influx line-protocol push endpoint from the Prometheus
          # remote-write endpoint (same account, different host/path).
          INFLUX_URL="$(printf '%s' "$RW_URL" | sed -e 's#prometheus-#influx-#' -e 's#/api/prom/push#/api/v1/push/influx/write#')"
          NOW="$(date +%s)"
          curl -sf --retry 3 --retry-all-errors \
            -u "${INSTANCE_ID}:${TOKEN}" \
            -H 'Content-Type: text/plain' \
            "${INFLUX_URL}" \
            --data-binary "flownative_ci_last_success_timestamp,job=docker-build,image=beach-php seconds=${NOW}"
